name: Release Helm Chart (single)

on:
  workflow_call:
    inputs:
      chart_name:
        description: Name of the Helm chart (directory under charts/)
        required: true
        type: string
      charts_dir:
        description: Directory containing charts
        required: false
        type: string
        default: charts
      tag:
        description: Chart version tag to release (overrides semantic-release, e.g. v1.2.3)
        required: false
        type: string
        default: ""
      cr_config:
        description: Path to chart-releaser config file
        required: false
        type: string
        default: .github/cr.yaml
      enable_signing:
        description: Sign chart packages with GPG. Off by default across all callers — opt in explicitly once gpg_key/gpg_key_name/gpg_passphrase secrets are confirmed working.
        required: false
        type: boolean
        default: false
    secrets:
      gpg_key:
        description: Base64-encoded exported GPG secret keyring (`gpg --export-secret-keys | base64`) used to sign chart packages. Signing is skipped if unset.
        required: false
      gpg_key_name:
        description: GPG key identity (uid or key ID) matching gpg_key
        required: false
      gpg_passphrase:
        description: Passphrase for the GPG private key
        required: false
permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || '' }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Semantic Release (dry-run)
        if: inputs.tag == ''
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        id: semantic_release
        with:
          dry_run: true
          branch: main
          tag_format: ${version}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB }}

      - name: Update Chart version
        id: chart_version
        if: steps.semantic_release.outputs.new_release_published == 'true' || inputs.tag != ''
        env:
          TAG_INPUT: ${{ inputs.tag }}
          NEW_RELEASE_TAG: ${{ steps.semantic_release.outputs.new_release_git_tag }}
          CHARTS_DIR: ${{ inputs.charts_dir }}
          CHART_NAME: ${{ inputs.chart_name }}
        run: |
          VERSION="${TAG_INPUT:-${NEW_RELEASE_TAG}}"
          VERSION="${VERSION#v}"
          sed -i "s/^version: .*/version: ${VERSION}/g" "${CHARTS_DIR}/${CHART_NAME}/Chart.yaml"
          echo "CHART_VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_exists
        if: steps.chart_version.outputs.CHART_VERSION != '' && inputs.tag == ''
        run: |
          TAG_EXISTS=true
          if ! [ $(git tag -l "v${{ steps.chart_version.outputs.CHART_VERSION }}") ]; then
              TAG_EXISTS=false
          fi
          echo "TAG_EXISTS=${TAG_EXISTS}" >> $GITHUB_OUTPUT

      - name: Set up Helm
        if: steps.tag_exists.outputs.TAG_EXISTS == 'false' || inputs.tag != ''
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Import GPG signing key
        id: gpg_import
        if: inputs.enable_signing && (steps.tag_exists.outputs.TAG_EXISTS == 'false' || inputs.tag != '')
        env:
          GPG_KEY: ${{ secrets.gpg_key }}
          GPG_PASSPHRASE: ${{ secrets.gpg_passphrase }}
        run: |
          # secrets cannot be referenced in `if:` conditionals, so the
          # enable/disable check happens here instead
          if [ -z "${GPG_KEY}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! echo "${GPG_KEY}" | base64 -d > "${RUNNER_TEMP}/keyring.gpg"; then
            echo "::error::gpg_key secret is not valid base64"
            exit 1
          fi

          size=$(stat -c%s "${RUNNER_TEMP}/keyring.gpg" 2>/dev/null || stat -f%z "${RUNNER_TEMP}/keyring.gpg")
          echo "Decoded keyring size: ${size} bytes"
          if [ "${size}" -eq 0 ]; then
            echo "::error::decoded keyring is empty — gpg_key secret was likely truncated/mis-set"
            exit 1
          fi

          echo "${GPG_PASSPHRASE}" > "${RUNNER_TEMP}/passphrase.txt"

          echo "Identities found in the imported keyring (compare against the gpg_key_name secret):"
          if ! gpg --show-keys "${RUNNER_TEMP}/keyring.gpg"; then
            echo "::error::keyring failed to parse as OpenPGP data — gpg_key secret content is invalid"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Run chart-releaser
        if: steps.tag_exists.outputs.TAG_EXISTS == 'false' || inputs.tag != ''
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: ${{ inputs.charts_dir }}
          config: ${{ inputs.cr_config }}
        env:
          CR_TOKEN: "${{ secrets.PAT_GITHUB }}"
          CR_SKIP_EXISTING: true
          CR_SIGN: ${{ steps.gpg_import.outputs.enabled == 'true' }}
          CR_KEY: ${{ secrets.gpg_key_name }}
          CR_KEYRING: ${{ runner.temp }}/keyring.gpg
          CR_PASSPHRASE_FILE: ${{ runner.temp }}/passphrase.txt

      - name: Login to the Container registry
        if: steps.tag_exists.outputs.TAG_EXISTS == 'false' || inputs.tag != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_GITHUB }}

      - name: Install Cosign
        if: steps.tag_exists.outputs.TAG_EXISTS == 'false' || inputs.tag != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Oras
        if: steps.tag_exists.outputs.TAG_EXISTS == 'false' || inputs.tag != ''
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      # ref: https://github.com/backstage/charts/blob/88240ce7a0726e3773ee0e4866fbe6325c15267b/.github/workflows/release.yml#L50
      - name: Publish and Sign OCI Charts
        if: steps.tag_exists.outputs.TAG_EXISTS == 'false' || inputs.tag != ''
        env:
          CHARTS_DIR: ${{ inputs.charts_dir }}
          COSIGN_EXPERIMENTAL: 1
        run: |
          for chart in $(find .cr-release-packages -name '*.tgz' -print); do
            helm push "${chart}" oci://ghcr.io/${GITHUB_REPOSITORY} |& tee helm-push-output.log
            file_name="${chart##*/}"
            chart_name="${file_name%-*}"
            digest=$(awk -F "[, ]+" '/Digest/{print $NF}' < helm-push-output.log)
            cosign sign -y "ghcr.io/${GITHUB_REPOSITORY}/${chart_name}@${digest}"

            oras push "ghcr.io/${GITHUB_REPOSITORY}/${chart_name}:artifacthub.io" \
              "./${CHARTS_DIR}/${chart_name}/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"
          done
