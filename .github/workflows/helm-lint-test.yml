name: Lint and Test Helm Charts

on:
  workflow_call:
    inputs:
      ct_config:
        description: Path to chart-testing config file
        required: false
        type: string
        default: .github/ct.yaml
      yamale_version:
        description: Yamale version for chart-testing
        required: false
        type: string
        default: "6.0.0"
      helm_extra_args:
        description: Extra arguments passed to helm install
        required: false
        type: string
        default: "--timeout 900s"
      timeout_minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 45

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          yamale_version: ${{ inputs.yamale_version }}

      - name: Run chart-testing (list-changed)
        id: list-changed
        env:
          CT_CONFIG: ${{ inputs.ct_config }}
        run: |
          changed=$(ct list-changed --config "$CT_CONFIG")
          if [[ -n "${changed}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CT_CONFIG: ${{ inputs.ct_config }}
        run: ct lint --config "$CT_CONFIG"

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Run ct install
        if: steps.list-changed.outputs.changed == 'true'
        env:
          CT_CONFIG: ${{ inputs.ct_config }}
          HELM_EXTRA_ARGS: ${{ inputs.helm_extra_args }}
        run: ct install --config "$CT_CONFIG" --helm-extra-args "$HELM_EXTRA_ARGS"

      - name: "(workflow_dispatch) Run ct install"
        if: github.event_name == 'workflow_dispatch'
        env:
          CT_CONFIG: ${{ inputs.ct_config }}
          HELM_EXTRA_ARGS: ${{ inputs.helm_extra_args }}
        run: ct install --config "$CT_CONFIG" --helm-extra-args "$HELM_EXTRA_ARGS" --all
